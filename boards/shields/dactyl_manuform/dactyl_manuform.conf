# Keyboard name (broadcast over BLE)
CONFIG_ZMK_KEYBOARD_NAME="Dactyl Manuform"

# Enable Bluetooth for split communication
CONFIG_ZMK_BLE=y
CONFIG_BT=y

# Enable USB (for connecting to computer)
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y

# Split keyboard settings
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Disable sleep (always USB powered)
CONFIG_ZMK_SLEEP=n

# No display
CONFIG_ZMK_DISPLAY=n
